
services:
  - type: web
    name: txg-device-verification
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: BOT_TOKENS_JSON
        sync: false

      - key: APP_ORIGIN
        sync: false

      - key: TRUST_PROXY
        value: "true"
